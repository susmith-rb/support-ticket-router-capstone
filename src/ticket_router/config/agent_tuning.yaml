# agent_tuning.yaml — Centralized Hill-Climbing Tuning Knobs Registry
# REQ-EVAL-008: Controlled Hill-Climbing Protocol & Config Registry
# All knobs default to existing production operating points (zero behavior change).

router:
  tau_esc: 0.50      # Escalation confidence floor
  tau_low: 0.15      # Auto-RAG uncertainty lower bound
  tau_intent: 0.70   # Intent classification confidence floor

prompts:
  tier2_router_version: "v5"
  faq_answer_version: "v2"

retrieval:
  search_config: "intent_soft_noisy_0.2"
  top_k: 5
  rerank_enabled: false
  citation_strictness: 0.70
  static_fallback_min_score: 0.50  # REQ-AGENT-028: Relevance score floor for static grounded fallback
