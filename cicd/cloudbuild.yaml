substitutions:
  _DEPLOY: 'false'
  _CORPUS_BUCKET: 'susmith-fde-ticket-router-laya'
  _LOCATION: 'global'
  _SERVICE_NAME: 'support-ticket-router'
  _RUN_EVAL: 'auto'

steps:
  # ===========================================================================
  # Step 0: Change Detection & Path Filtering (Change-Aware Pipeline)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'detect-changes'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gsutil cat "gs://${_CORPUS_BUCKET}/ci/state.json" > /workspace/ci_state_prev.json 2>/dev/null || echo '{}' > /workspace/ci_state_prev.json
        python3 scripts/ci_changes.py \
          --env-file /workspace/changes.env \
          --state-in /workspace/ci_state_prev.json \
          --state-out /workspace/ci_state_new.json

  # ===========================================================================
  # Step 1: Unit, Resilience, Ruff Lint & Spec Traceability Tests (blocking)
  # ===========================================================================
  - name: 'python:3.11-slim'
    id: 'unit-and-resilience-tests'
    waitFor: ['detect-changes']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Installing test and lint dependencies ==="
        python -m pip install --no-cache-dir -r requirements-dev.txt

        echo "=== Running conservative Ruff linter (select E, F; ignore E501) ==="
        ruff check .

        echo "=== Running offline test suite and spec traceability ==="
        python -m pytest -v --cov=src/ticket_router --cov-branch --cov-fail-under=80 --deselect tests/infra/test_ge_app_and_trace.py::test_ge_app_infra_and_registration_contract

        echo "=== Verifying Python byte-compilation ==="
        python -m py_compile src/ticket_router/*.py src/ticket_router/**/*.py evals/*.py corpus/*.py experiments/*.py
        if [ -d "training/router_s1/pipeline" ]; then
          python -m py_compile training/router_s1/pipeline/*.py
        fi

        echo "=== Linting FAQ corpus policy and metadata ==="
        python -m corpus.publish_faq --work rag/corpus_v2 --lint-only

  # ===========================================================================
  # Step 2: Static Terraform Checks (runs only if deploy/terraform/** changed)
  # ===========================================================================
  - name: 'hashicorp/terraform:1.9.8'
    id: 'terraform-fmt-check'
    waitFor: ['detect-changes']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ -f /workspace/changes.env ]; then . /workspace/changes.env; fi
        if [ "$${TERRAFORM_CHANGED:-true}" != "true" ]; then
          echo "Skipping terraform fmt check: deploy/terraform/ unchanged"
          exit 0
        fi
        terraform fmt -check -recursive deploy/terraform

  - name: 'hashicorp/terraform:1.9.8'
    id: 'terraform-validate'
    waitFor: ['terraform-fmt-check']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        if [ -f /workspace/changes.env ]; then . /workspace/changes.env; fi
        if [ "$${TERRAFORM_CHANGED:-true}" != "true" ]; then
          echo "Skipping terraform validate: deploy/terraform/ unchanged"
          exit 0
        fi
        cd deploy/terraform/bootstrap
        terraform init -backend=false
        terraform validate
        cd ../single-project
        terraform init -backend=false
        terraform validate

  - name: 'ghcr.io/terraform-linters/tflint:v0.53.0'
    id: 'terraform-tflint'
    waitFor: ['terraform-validate']
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ -f /workspace/changes.env ]; then . /workspace/changes.env; fi
        if [ "$${TERRAFORM_CHANGED:-true}" != "true" ]; then
          echo "Skipping tflint: deploy/terraform/ unchanged"
          exit 0
        fi
        tflint --recursive --chdir=deploy/terraform

  # ===========================================================================
  # Step 3: Golden Retrieval Evaluation Gate (blocks build/deploy on regression)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'fetch-eval-dataset'
    waitFor: ['unit-and-resilience-tests']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -f /workspace/changes.env ]; then . /workspace/changes.env; fi
        RUN_EVAL="${_RUN_EVAL}"
        if [ "$${RUN_EVAL}" = "false" ]; then
          echo "Skipping eval dataset fetch: disabled via _RUN_EVAL=false"
          exit 0
        elif [ "$${RUN_EVAL}" = "auto" ]; then
          if [ "$${RETRIEVAL_CHANGED:-false}" != "true" ]; then
            echo "Skipping eval dataset fetch: no retrieval-relevant changes"
            exit 0
          fi
        fi

        echo "=== Fetching evaluation dataset and multi-annotator labels from GCS ==="
        mkdir -p /workspace/eval
        gsutil -m cp "gs://${_CORPUS_BUCKET}/eval/*" /workspace/eval/

  - name: 'python:3.11-slim'
    id: 'golden-eval-gate'
    waitFor: ['fetch-eval-dataset']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -f /workspace/changes.env ]; then . /workspace/changes.env; fi
        RUN_EVAL="${_RUN_EVAL}"
        if [ "$${RUN_EVAL}" = "false" ]; then
          echo "Skipping golden eval gate: disabled via _RUN_EVAL=false"
          exit 0
        elif [ "$${RUN_EVAL}" = "auto" ]; then
          if [ "$${RETRIEVAL_CHANGED:-false}" != "true" ]; then
            echo "Skipping golden eval gate: no retrieval-relevant changes (set _RUN_EVAL=true to force)"
            exit 0
          fi
        fi

        echo "=== Installing runtime dependencies ==="
        pip install --no-cache-dir -e .[runtime]

        LABELS_ARG=""
        if [ -f /workspace/eval/labels_c2.jsonl ]; then
          LABELS_ARG="--labels-c /workspace/eval/labels_c2.jsonl"
        elif [ -f /workspace/eval/labels_c.jsonl ]; then
          LABELS_ARG="--labels-c /workspace/eval/labels_c.jsonl"
        fi

        BASELINE_ARG=""
        if [ -f /workspace/eval/baseline.json ]; then
          BASELINE_ARG="--baseline /workspace/eval/baseline.json"
        fi

        echo "=== Executing Golden Evaluation Gate ==="
        python -m evals.ci_eval_gate \
          --queries /workspace/eval/dev.jsonl \
          $${LABELS_ARG} \
          $${BASELINE_ARG} \
          --retrieval-config intent_soft_noisy_0.2 \
          --project "${PROJECT_ID}" \
          --location "${_LOCATION}" \
          --min-recall 0.90 \
          --min-mrr 0.75 \
          --max-ndcg-drop 0.02 \
          --out /workspace/eval_gate_result.json \
          --enforce-gate

  # ===========================================================================
  # Step 4: Corpus Reindexing (Runs only on main if rag/corpus_v2/** changed)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'corpus-reindex-on-main'
    waitFor: ['golden-eval-gate']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ -f /workspace/changes.env ]; then . /workspace/changes.env; fi
        if [ "$${CORPUS_CHANGED:-false}" != "true" ] || [ "${BRANCH_NAME}" != "main" ]; then
          echo "Skipping corpus reindex: rag/corpus_v2/ unchanged or not running on main"
          exit 0
        fi
        echo "=== Installing Python dependencies in virtualenv ==="
        apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv python3-pip >/dev/null
        python3 -m venv /workspace/.venv-rt
        /workspace/.venv-rt/bin/pip install --no-cache-dir -q -e .[runtime]
        echo "=== Publishing new corpus release to Discovery Engine ==="
        /workspace/.venv-rt/bin/python -m corpus.publish_faq \
          --work rag/corpus_v2 \
          --project "${PROJECT_ID}" \
          --location "${_LOCATION}"

  # ===========================================================================
  # Step 5: Container Build (Placeholder — depends on Tests & Eval Gate)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'docker-build-service'
    waitFor: ['golden-eval-gate']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Build step deferred: service container definition pending agent service implementation."
          exit 0
        fi
        echo "Building service container image: ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/services/${_SERVICE_NAME}:${SHORT_SHA}"
        # docker build -t "${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/services/${_SERVICE_NAME}:${SHORT_SHA}" -t "${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/services/${_SERVICE_NAME}:latest" .

  # ===========================================================================
  # Step 6: Container Push to Artifact Registry (Placeholder)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'docker-push-service'
    waitFor: ['docker-build-service']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Push step deferred: service container push pending."
          exit 0
        fi
        # docker push "${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/services/${_SERVICE_NAME}:${SHORT_SHA}"
        # docker push "${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/services/${_SERVICE_NAME}:latest"

  # ===========================================================================
  # Step 7: Deploy to Cloud Run (Placeholder — IAP Authenticated Ingress)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'deploy-cloud-run'
    waitFor: ['docker-push-service']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Deploy step deferred: Cloud Run service deployment pending."
          exit 0
        fi
        # Security invariant: authenticated ingress required (no unauthenticated access permitted)
        # gcloud run deploy "${_SERVICE_NAME}" \
        #   --image "${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/services/${_SERVICE_NAME}:${SHORT_SHA}" \
        #   --region "us-central1" \
        #   --no-allow-unauthenticated \
        #   --service-account "ticket-router-runtime@${PROJECT_ID}.iam.gserviceaccount.com"

  # ===========================================================================
  # Step 8: Post-Deploy Smoke Verification (Placeholder)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'post-deploy-smoke'
    waitFor: ['deploy-cloud-run']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${_DEPLOY}" != "true" ]; then
          echo "Post-deploy smoke verification deferred."
          exit 0
        fi
        # python3 scripts/test_alerting_e2e.py --smoke-only

  # ===========================================================================
  # Step 9: Record CI State (Only on main after all prior terminal steps pass)
  # ===========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'record-ci-state'
    waitFor: ['post-deploy-smoke', 'corpus-reindex-on-main', 'terraform-tflint']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${BRANCH_NAME}" != "main" ]; then
          echo "Skipping CI state recording: not running on main branch"
          exit 0
        fi
        RUN_EVAL="${_RUN_EVAL}"
        if [ "$${RUN_EVAL}" = "false" ]; then
          echo "Preserving previous retrieval fingerprint because _RUN_EVAL=false"
          python3 scripts/ci_changes.py \
            --keep-prev retrieval \
            --state-in /workspace/ci_state_prev.json \
            --state-out /workspace/ci_state_new.json
        fi
        echo "=== Recording updated CI state to GCS ==="
        gsutil cp /workspace/ci_state_new.json "gs://${_CORPUS_BUCKET}/ci/state.json"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
