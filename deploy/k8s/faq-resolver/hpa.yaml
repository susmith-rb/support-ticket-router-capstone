apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: faq-resolver-hpa
  namespace: faq-resolver
  labels:
    app: faq-resolver
    app.kubernetes.io/name: faq-resolver
    app.kubernetes.io/part-of: support-ticket-router
    cost_center: support-ticket-router
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: faq-resolver
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
