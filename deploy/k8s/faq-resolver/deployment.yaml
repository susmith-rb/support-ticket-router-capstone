apiVersion: apps/v1
kind: Deployment
metadata:
  name: faq-resolver
  namespace: faq-resolver
  labels:
    app: faq-resolver
    app.kubernetes.io/name: faq-resolver
    app.kubernetes.io/part-of: support-ticket-router
    cost_center: support-ticket-router
    registry.gke.io/functional-type: "AGENT"
  annotations:
    a2a-protocol.org/agent-card: |
      card: {endpoint: /.well-known/agent-card.json, protocol: HTTP, port: 8080}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faq-resolver
  template:
    metadata:
      labels:
        app: faq-resolver
        app.kubernetes.io/name: faq-resolver
        app.kubernetes.io/part-of: support-ticket-router
      annotations:
        iam.gke.io/identity: "spiffe://agents.global.org-349636765856.system.id.goog/*"
        iam.gke.io/inject-podcertificates: "true"
        iam.gke.io/spiffe-identity-type: "agent-identity"
    spec:
      serviceAccountName: ksa-faq
      containers:
      - name: faq-resolver
        image: us-central1-docker.pkg.dev/susmith-fde-ticket-router/serving/agents:72af728
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVICE
          value: "faq_resolver"
        - name: GOOGLE_CLOUD_PROJECT
          value: "susmith-fde-ticket-router"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: AGENT_SEARCH_LOCATION
          value: "global"
        - name: AGENT_SEARCH_ENGINE_ID
          value: "support-kb-search"
        - name: ROUTER_S1_ENDPOINT
          value: "projects/susmith-fde-ticket-router/locations/us-central1/endpoints/router-s1-dedicated"
        - name: ROUTER_S1_BASE_URL
          value: "https://router-s1-dedicated.us-central1-620485621180.prediction.vertexai.goog"
        - name: ORDER_LOOKUP_MCP_URL
          value: "https://order-lookup-mcp-34mwh7k34a-uc.a.run.app"
        - name: TICKET_DB_MCP_URL
          value: "https://ticket-db-mcp-34mwh7k34a-uc.a.run.app"
        - name: HUMAN_QUEUE_URL
          value: "https://human-queue-34mwh7k34a-uc.a.run.app"
        - name: HUMAN_QUEUE_TOPIC
          value: "human-queue"
        - name: FAQ_RESOLVER_URL
          value: "https://faq.sslip.io"
        - name: FAQ_RESOLVER_AUDIENCE
          value: "https://faq.sslip.io"
        - name: ALLOWED_CALLERS
          value: "sa-triage@susmith-fde-ticket-router.iam.gserviceaccount.com"
        - name: MODEL_ARMOR_TEMPLATE
          value: "projects/susmith-fde-ticket-router/locations/us-central1/templates/support-router-lean"
        - name: MODEL_ARMOR_ENABLED
          value: "1"
        - name: ENABLE_CLOUD_TRACE
          value: "1"
        - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
          value: "NO_CONTENT"
        - name: REQUIRE_REAL_DEPS
          value: "1"
        - name: FAQ_AGENT_IDENTITY
          value: "1"
        # Discovery Engine SearchClient uses urllib.request without mTLS support;
        # runtime bound tokens disabled so google-auth requests unbound tokens.
        - name: GOOGLE_API_ENABLE_RUNTIME_BOUND_TOKEN
          value: "false"
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
