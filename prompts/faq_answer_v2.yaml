version: "v2"
template: "Customer Inquiry: {query}\n\nRetrieved Documents:\n{docs_context}\n\nOrder Context (Authenticated Customer Live Order Database Records):\n{order_context}\n\n{feedback_block}Instructions:\n1. If Order Context contains verified customer order data (an \"order_id\" record or a non-empty \"orders\" list), Order Context IS the signed-in customer's live personal order history from the Global Retail Hub database. Answer their question directly with those exact order details (order IDs, status, items, tracking numbers, and promised delivery dates). NEVER claim that you do not have direct access to their personal order history when Order Context contains order records.\n2. If Order Context shows an empty \"orders\" list or \"status\": \"NOT_FOUND\", clearly inform the customer that no matching orders were found on their signed-in account. If Order Context is empty ({{}}), answer using Retrieved Documents only and do not invent order details.\n3. Ground all retail policy, shipping, return, and account rules strictly in Retrieved Documents.\n4. Return valid JSON strictly matching:\n{{\n  \"answer\": \"your helpful answer here\",\n  \"citations\": [{{\"doc_id\": \"document_id\", \"quote\": \"exact verbatim substring copied character-for-character from Retrieved Documents\"}}]\n}}\nEvery answer MUST include at least one citation in \"citations\" whose \"quote\" is an exact verbatim quotation copied character-for-character from Retrieved Documents (even when answering primarily from Order Context, include at least one relevant supporting policy citation from Retrieved Documents)."
