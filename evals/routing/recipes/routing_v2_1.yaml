# Declarative dataset recipe for routing_v1
# REQ-REVAL-004 / REQ-REVAL-005 / REQ-REVAL-006 / REQ-REVAL-009 / REQ-REVAL-020

dataset_version: "routing_v2.1.0"
seed: 20261028

quotas:
  dev: 400
  regression: 150
  heldout: 400

languages:
  - "en"

split_mix:
  dev:
    real_fresh: 150
    bitext: 80
    synthetic_jetski: 100
    synthetic_template: 30
    paraphrase_perturbation: 40
    contaminated_c2: 120
  heldout:
    real_fresh: 150
    bitext: 80
    synthetic_jetski: 100
    synthetic_template: 30
    paraphrase_perturbation: 40

contamination:
  laya_hashes_path: ".cache/routing_eval/laya_hashes.json"
  keys:
    - "train_val"
    - "test"

sources:
  real_fresh:
    threads_path: ".cache/routing_eval/raw/threads.jsonl"
    n: 320
    seed: 20261028

  real_c2:
    labels_path: "rag/labels/retrieval_v1/labels_C2.jsonl"
    queries_path: "rag/labels/retrieval_v1/queries_blind.jsonl"
    manifest_path: "rag/corpus_v2/manifest.jsonl"

  real_golden:
    golden_csv_path: "training/router_s1/results/v2/golden_all_model_outputs.csv"

  public_bitext:
    csv_path: ".cache/routing_eval/raw/bitext/Bitext_Sample_Customer_Support_Training_Dataset_27K_responses-v11.csv"
    n: 300
    per_intent_min: 8
    seed: 20261028

  regression:
    yaml_path: "evals/routing/regression_seeds.yaml"
    adversarial_path: "evals/data/adversarial_tone_v1.jsonl"

  synthetic_templates:
    n_target: 60
    scenarios:
      - "missing_info"
      - "conflicting"
      - "rare"
      - "long"
      - "ood"

perturbations:
  num_c2_bases: 60
  variants_per_base: 2
  meaning_preserving_types:
    - "typos"
    - "case"
    - "punctuation_strip"
    - "emoji_slang"
    - "long_padding"
    - "prompt_injection"
  semantic_altering_bases: 20
  semantic_altering_types:
    - "truncate"
    - "conflicting_info"

paraphrases:
  num_c2_bases: 40
  paraphrases_per_base: 3

synthetic_generation:
  target_total: 260
  tickets_per_packet: 10
  scenario_weights:
    ambiguous: 50
    conflicting: 30
    missing_info: 30
    rare: 30
    ood: 40
    long: 30
    prompt_injection: 30
    noisy: 20

annotation:
  k_passes: 3
  batch_size: 20

