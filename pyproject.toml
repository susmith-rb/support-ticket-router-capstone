[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-router-capstone"
version = "0.1.0"
description = "Support Ticket Router & Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "pyyaml>=6.0",
    "google-auth>=2.0.0",
    "requests>=2.28.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]
db = [
    "cloud-sql-python-connector[pg8000]>=1.14.0",
    "pg8000>=1.31.2",
]
runtime = [
    "google-auth>=2.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]
experiments = [
    "google-auth>=2.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
]
agents = [
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "cryptography>=42.0.0",
]
deploy = [
    "google-cloud-aiplatform[agent_engines,adk]>=1.75.0",
    "google-adk>=2.2.0",
    "cloudpickle==3.0.0",
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "requests>=2.32.0",
    "google-auth>=2.27.0",
    "pyyaml>=6.0.1",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "cryptography>=42.0.0",
]

[tool.setuptools]
package-dir = { "" = "src", "evals" = "evals", "corpus" = "corpus", "experiments" = "experiments", "training" = "training" }
packages = [
    "ticket_router",
    "ticket_router.config",
    "ticket_router.common",
    "ticket_router.retrieval",
    "ticket_router.store",
    "ticket_router.identity",
    "ticket_router.security",
    "ticket_router.models",
    "ticket_router.mcp",
    "ticket_router.mcp.ticket_db",
    "ticket_router.mcp.order_lookup",
    "ticket_router.agents",
    "ticket_router.agents.triage_router",
    "ticket_router.agents.faq_resolver",
    "ticket_router.agents.human_queue",
    "ticket_router.handoff",
    "evals",
    "evals.latency",
    "corpus",
    "experiments",
    "training",
    "training.router_s1",
    "training.router_s1.pipeline",
]

[tool.setuptools.package-data]
"ticket_router.config" = ["models.yaml", "taxonomy.yaml", "agent_tuning.yaml"]
"evals.latency" = ["cases_v1.jsonl"]

